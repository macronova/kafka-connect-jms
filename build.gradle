// Release command:
// $ ./gradlew clean build zip # (optionally 'publish' to release new version in Maven repository)

import org.apache.tools.ant.filters.ReplaceTokens

plugins {
	id 'java-library'
	id 'maven-publish'
	id 'signing'
	id 'idea'
	id 'jacoco'
}

group = 'io.macronova.kafka'
version = '1.0.0'

java {
	withSourcesJar()
	withJavadocJar()
}

tasks.withType( JavaCompile ).configureEach {
	options.release = 8
	options.encoding = 'UTF-8'
}

tasks.withType( Javadoc ).configureEach {
	options.addStringOption( 'Xdoclint:none', '-quiet' )
}

repositories {
	mavenCentral()
	maven {
		url = uri( 'https://packages.confluent.io/maven' )
	}
}

tasks.withType( Test ).configureEach {
	// Some failure modes (e.g. waiting for acknowledgements that never arrive) block forever; fail instead of hanging.
	timeout = java.time.Duration.ofMinutes( 10 )
	testLogging {
		events 'failed'
		exceptionFormat = 'full'
	}
}

// Compile against old, API-compatible "floor" versions (see dependencies below), but run the tests against
// current, vulnerability-free releases. Nothing from the test runtime is shipped with the connector.
ext.pinTestRuntime = { Configuration cfg, String kafkaVersion, String activeMqVersion ->
	cfg.resolutionStrategy.force(
			"org.apache.kafka:connect-api:${kafkaVersion}",
			"org.apache.kafka:connect-json:${kafkaVersion}",
			"org.apache.kafka:kafka-clients:${kafkaVersion}",
			"org.apache.activemq:activemq-broker:${activeMqVersion}",
			"org.apache.activemq:activemq-client:${activeMqVersion}",
			'org.xerial.snappy:snappy-java:1.1.10.12',
			'com.google.guava:guava:33.8.0-jre',
			'org.apache.commons:commons-lang3:3.22.0'
	)
	// Confluent's Avro converter (used for the 'avro' output format) must match the Kafka version: Confluent Platform
	// 7.9 is based on Kafka 3.9 and 8.x on Kafka 4.x. The kafka-* and common-* artifacts share that version number.
	def confluentVersion = kafkaVersion.startsWith( '3.' ) ? '7.9.11' : '8.4.1'
	cfg.resolutionStrategy.eachDependency { details ->
		if ( details.requested.group == 'io.confluent' &&
				( details.requested.name.startsWith( 'kafka-' ) || details.requested.name.startsWith( 'common-' ) ) ) {
			details.useVersion( confluentVersion )
		}
	}
	// lz4-java has known vulnerabilities in every release and the tests never use LZ4 compression.
	cfg.exclude group: 'org.lz4', module: 'lz4-java'
	cfg.exclude group: 'at.yawk.lz4', module: 'lz4-java'
}

// Registers one Test task per Kafka version / JDK combination for a variant of the connector, plus an aggregate task.
//   variant:      prefix of the task names, e.g. 'javaee'
//   mainSet / testSet: the source sets holding the connector and its tests
//   baseClasspath: a configuration holding the test dependencies to start from
//   kafkaMatrix:  [ kafkaVersion: [ jdk, ... ] ]
//   activeMqFor:  closure mapping a JDK to the ActiveMQ version to run the tests against
ext.registerTestMatrix = { String variant, SourceSet mainSet, SourceSet testSet, Configuration baseClasspath,
		Map<String, List<Integer>> kafkaMatrix, Closure<String> activeMqFor ->
	def aggregate = tasks.register( "test${variant.capitalize()}Matrix" ) {
		group = 'verification'
		description = "Runs the ${variant} unit tests for every Kafka version / JDK combination."
	}
	kafkaMatrix.each { kafkaVersion, jdks ->
		jdks.each { jdk ->
			def name = "test${variant.capitalize()}Kafka${kafkaVersion.replace( '.', '_' )}Java${jdk}"
			def classpathConfig = configurations.create( "${name}RuntimeClasspath" ) {
				canBeConsumed = false
				canBeResolved = true
				extendsFrom baseClasspath
				attributes {
					attribute( Usage.USAGE_ATTRIBUTE, objects.named( Usage, Usage.JAVA_RUNTIME ) )
				}
			}
			pinTestRuntime( classpathConfig, kafkaVersion, activeMqFor( jdk ) )
			def matrixTask = tasks.register( name, Test ) {
				group = 'verification'
				description = "${variant} unit tests against Kafka Connect ${kafkaVersion} on Java ${jdk}."
				useJUnit()
				testClassesDirs = testSet.output.classesDirs
				classpath = files( testSet.output, mainSet.output ) + classpathConfig
				javaLauncher = javaToolchains.launcherFor {
					languageVersion = JavaLanguageVersion.of( jdk )
				}
				reports.html.outputLocation = layout.buildDirectory.dir( "reports/tests/${name}" )
				reports.junitXml.outputLocation = layout.buildDirectory.dir( "test-results/${name}" )
			}
			aggregate.configure { dependsOn matrixTask }
		}
	}
	return aggregate
}

// Kafka 4.x requires Java 17 or newer; Kafka 3.9 runs on Java 8 and newer.
// ActiveMQ 5.19 needs Java 11 or newer; Java 8 can only run the old 5.15 broker (test scope only).
pinTestRuntime( configurations.testRuntimeClasspath, '3.9.2', '5.19.12' )
def javaeeMatrix = registerTestMatrix(
		'javaee', sourceSets.main, sourceSets.test, configurations.testRuntimeClasspath,
		[ '3.9.2': [ 8, 17, 21, 25 ], '4.4.0': [ 17, 21, 25 ] ], { int jdk -> jdk >= 11 ? '5.19.12' : '5.15.4' }
)

// Run everything with: ./gradlew testMatrix
tasks.register( 'testMatrix' ) {
	group = 'verification'
	description = 'Runs the unit tests of every variant for every Kafka version / JDK combination.'
	dependsOn javaeeMatrix
}

jacocoTestReport {
	reports {
		xml.required = true
		html.required = false
	}
}

check.dependsOn jacocoTestReport

publishing {
	publications {
		mavenJava( MavenPublication ) {
			from components.java
			pom {
				name = 'Kafka Connect JMS'
				description = 'Sink and source JMS connector for Kafka Connect.'
				url = 'https://github.com/macronova/kafka-connect-jms'
				licenses {
					license {
						name = 'The Apache License, Version 2.0'
						url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
					}
				}
				developers {
					developer {
						id = 'Macronova'
						name = 'Macronova'
						email = 'office@macronova.io'
					}
				}
				scm {
					connection = 'scm:git:git://github.com/macronova/kafka-connect-jms.git'
					developerConnection = 'scm:git:ssh://github.com:macronova/kafka-connect-jms.git'
					url = 'https://github.com/macronova/kafka-connect-jms'
				}
			}
		}
	}
	repositories {
		maven {
			credentials {
				username = project.hasProperty( 'ossrhUsername' ) ? project.property( 'ossrhUsername' ) : ''
				password = project.hasProperty( 'ossrhPassword' ) ? project.property( 'ossrhPassword' ) : ''
			}
			url = version.endsWith( 'SNAPSHOT' ) ? "$buildDir/repos/snapshots" : "$buildDir/repos/releases"
			// url = version.endsWith('SNAPSHOT') ? "https://oss.sonatype.org/content/repositories/snapshots/" : "https://oss.sonatype.org/service/local/staging/deploy/maven2/"
		}
	}
}

signing {
	// Only sign when a key is configured, so that plain builds work without secrets.
	required = project.hasProperty( 'signing.keyId' ) && project.hasProperty( 'signing.secretKeyRingFile' ) &&
			file( project.property( 'signing.secretKeyRingFile' ) ).exists()
	sign publishing.publications.mavenJava
}

tasks.register( 'prepareConfluentHubArchive', Copy ) {
	dependsOn 'build'
	into layout.buildDirectory
	from( 'docs/manifest.json' ) {
		expand( project: project )
	}
	from( 'docs' ) {
		include 'macronova-logo.png'
		include 'jms-logo.png'
		include 'apache-logo.png'
		into 'archive/assets'
	}
	from( '.' ) {
		include 'README.md'
		include 'LICENSE'
		into 'archive/doc'
	}
	from( 'docs' ) {
		include 'quickstart-jms-sink.properties'
		include 'quickstart-jms-source.properties'
		into 'archive/etc'
	}
	from( layout.buildDirectory.dir( 'libs' ) ) {
		include "${project.name}-${project.version}.jar"
		into 'archive/lib'
	}
}

tasks.register( 'buildConfluentHubArchive', Zip ) {
	dependsOn 'prepareConfluentHubArchive'
	from layout.buildDirectory.file( 'manifest.json' ), layout.buildDirectory.dir( 'archive' )
	archiveFileName = "macronova-${project.name}-${project.version}.zip"
	destinationDirectory = layout.buildDirectory.dir( 'confluent-hub' )
}

dependencies {
	compileOnly 'org.apache.kafka:connect-api:2.4.0'
	compileOnly 'org.apache.kafka:connect-json:2.4.0' // Convert Kafka Connect data to JSON format.
	compileOnly 'io.confluent:kafka-connect-avro-converter:5.0.0' // Convert Kafka Connect data to Apache Avro format.
	api 'javax.jms:javax.jms-api:2.0.1'

	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.apache.kafka:connect-api:2.4.0'
	testImplementation 'org.apache.kafka:connect-json:2.4.0'
	testImplementation 'org.apache.activemq:activemq-broker:5.15.4'
	testImplementation 'io.confluent:kafka-connect-avro-converter:5.0.0'
	testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.17'
}

processResources {
	filter ReplaceTokens, tokens: [
			'application.version': project.property( 'version' )
	]
}

// Distribution archive (connector JAR plus runtime dependencies), consumed by the Dockerfile.
tasks.register( 'zip', Zip ) {
	from jar
	from configurations.runtimeClasspath
	into( project.name + '-' + project.version )
}


apply from: 'gradle/jakarta.gradle'
